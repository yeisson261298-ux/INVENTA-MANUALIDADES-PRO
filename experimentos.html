<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>Calculadora de experimentos - INVENTA</title>
<style>
:root{--bg:#0b1220;--surface:#121a2c;--surface3:#0e1728;--border:#243050;--text:#e8edf7;--dim:#8b98b3;--teal:#2dd4bf;--copper:#eba454;--green:#3ee08a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}body{min-height:100vh}.app{max-width:760px;margin:auto;padding:14px 10px 26px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}.top h1{font-size:17px;margin:0}.top p{font-size:12px;color:var(--dim);margin:3px 0 0}.brand{display:flex;align-items:center;gap:9px}.dot{width:9px;height:9px;background:var(--teal);border-radius:3px}.actions{display:flex;gap:6px}.actions button,.admin-zone button{border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--dim);padding:9px 10px;font-size:12px;font-weight:700}.actions .admin{border-color:var(--teal);color:var(--teal)}.back{display:inline-block;color:var(--teal);text-decoration:none;font-size:13px;margin-bottom:12px}
.table{overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.row{display:grid;grid-template-columns:minmax(0,38%) 16% 23% 23%;min-height:44px}body.is-admin .row{grid-template-columns:minmax(0,34%) 14% 21% 21% 10%}.row>div{border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 4px;min-width:0}.header{background:var(--surface3);font-size:10px;font-weight:800;color:var(--dim);min-height:38px}.component{font-size:11px;font-weight:650;justify-content:flex-start!important;text-align:left!important;padding:7px 8px!important}.price{font-size:12px;color:var(--dim)}.price-input,.name-input,.qty input{width:95%;height:32px;border:1px solid var(--border);border-radius:7px;background:var(--surface3);color:#fff;text-align:center}.name-input{font-size:10px}.qty input{font-size:15px}.total{font-size:13px;font-weight:800;color:var(--teal)}.delete-col{display:none}body.is-admin .delete-col{display:flex}.danger{background:#dc2626;color:white;border:0;border-radius:6px;padding:5px}.admin-zone{display:none;padding:10px;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border)}body.is-admin .admin-zone{display:flex}.summary{display:grid;grid-template-columns:7px 1fr auto;min-height:48px;background:var(--surface3);border-bottom:1px solid var(--border)}.bar{background:var(--border)}.lab{display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:800;color:var(--dim)}.val{display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-weight:800}.mayor .bar{background:var(--copper)}.cobrar{background:#123b31}.cobrar .bar{background:var(--green)}.cobrar .lab,.cobrar .val{color:var(--green)}.multiplier{display:none;align-items:center;gap:4px}body.is-admin .multiplier{display:flex}.multiplier input{width:48px;background:#121a2c;color:white;border:1px solid var(--border);border-radius:5px}.offline{text-align:center;color:var(--dim);font-size:11px;margin-top:14px}#login{position:fixed;inset:0;z-index:10;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.login-box{width:min(340px,100%);padding:22px;background:#172238;border:1px solid #39465d;border-radius:18px}.login-box input{width:100%;padding:12px;margin:6px 0;background:#0e1728;border:1px solid var(--border);border-radius:8px;color:white}.login-actions{display:flex;gap:8px}.login-actions button{flex:1;padding:11px;border:1px solid var(--teal);border-radius:8px;background:transparent;color:var(--teal)}.hint{color:#fca5a5;min-height:18px;font-size:12px}
</style></head><body><main class="app"><a class="back" href="./index.html">← Menú principal</a><header class="top"><div class="brand"><span class="dot"></span><div><h1>CALCULADORA DE EXPERIMENTOS</h1><p>Calculadora de materiales y precios</p></div></div><div class="actions"><button id="adminBtn" class="admin">ADMIN</button><button id="resetBtn">LIMPIAR</button></div></header>
<section class="table"><div class="row header"><div>COMPONENTE</div><div>PRECIO</div><div>CANTIDAD</div><div>TOTAL</div></div><div id="rows"></div><div class="admin-zone"><button id="addBtn">+ AGREGAR</button><button id="saveBtn">GUARDAR CAMBIOS</button></div><div><div class="summary"><div class="bar"></div><div class="lab">PRECIO TOTAL</div><div id="grandTotal" class="val">0</div></div><div class="summary mayor"><div class="bar"></div><div class="lab">POR MAYOR <span class="multiplier">x <input id="wholesaleMult" type="number" step=".1"></span></div><div id="wholesaleTotal" class="val">0</div></div><div class="summary cobrar"><div class="bar"></div><div class="lab">AL PÚBLICO <span class="multiplier">x <input id="publicMult" type="number" step=".1"></span></div><div id="chargeTotal" class="val">0</div></div></div></section><p class="offline" id="status">● Conectando...</p></main>
<div id="login"><div class="login-box"><h2>Acceso administrador</h2><input id="username" placeholder="Usuario"><input id="password" type="password" placeholder="Clave"><div class="hint" id="loginError"></div><div class="login-actions"><button id="loginBtn">ENTRAR</button><button id="closeLoginBtn">CERRAR</button></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCmSEMVVBmrxRGOIQ9vJkghqkpqR_gKYis", authDomain: "manualidades-pwa.firebaseapp.com", projectId: "manualidades-pwa", storageBucket: "manualidades-pwa.firebasestorage.app", messagingSenderId: "729918672131", appId: "1:729918672131:web:e29b58a7f89eaeed5ead36" };
const appFB = initializeApp(firebaseConfig); const db = getFirestore(appFB); const docRef = doc(db, "inventa_config", "experimentos");
const DEFAULT_ITEMS=[["PORTAPILAS",2],["INTERRUPTOR",1],["INTERRUPTOR (3patas)",3],["LED",0.5],["MOTOR RF -310T(5.9v)",6],["MOTOR DC (130)",6],["MOTOR MABUCHI (9v)",9],["MOTOR MABUCHI MMN (8v)",10],["MOTOR - BOMBA DE AGUA",9],["PANEL - 5v",12],["PANEL - Medio",15],["BROCHE PARA BATERIA",2],["CABLE",0.5],["MANGUERA (VENOCLISIS)",1],["JERINGA",0.3],["BATERIA TOSHIBA",7],["BATERIA DURACELL",17],["PILA PANASONIC",2],["PILA DURACELL",7],["DIODO",0.2],["RESISTENCIA",0.2],["ARDUINO UNO",42],["ARDUINO NANO",38],["SERVOMOTOR",12],["SENSOR ULTRA SONICO",12],["SENSOR DE LLUVIA",12],["INTERRUPTOR (6 patas)",5]];
let isAdmin=false,quantities={}; let config={items:DEFAULT_ITEMS,wholesale:2.3,public:2.7};
const $=id=>document.getElementById(id); const money=n=>(Number.isFinite(n)?n:0).toLocaleString("es-PE",{minimumFractionDigits:0,maximumFractionDigits:2}); const escapeHtml=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){document.body.classList.toggle("is-admin",isAdmin);$("adminBtn").textContent=isAdmin?"SALIR":"ADMIN";$("wholesaleMult").value=config.wholesale;$("publicMult").value=config.public;$("rows").innerHTML=config.items.map((it,i)=>`<div class="row"><div class="component">${isAdmin?`<input class="name-input" data-name="${i}" value="${escapeHtml(it[0])}">`:escapeHtml(it[0])}</div><div class="price">${isAdmin?`<input class="price-input" data-price="${i}" type="number" step=".01" value="${Number(it[1])||0}">`:money(Number(it[1])||0)}</div><div class="qty"><input data-qty="${i}" type="number" min="0" step="any" placeholder="0" value="${quantities[i]||""}"></div><div class="total" id="t${i}">0</div>${isAdmin?`<div class="delete-col"><button class="danger" data-del="${i}">X</button></div>`:""}</div>`).join("");$("rows").querySelectorAll("[data-qty]").forEach(e=>e.addEventListener("input",calculate));$("rows").querySelectorAll("[data-price]").forEach(e=>e.addEventListener("input",()=>{config.items[+e.dataset.price][1]=Math.max(0,Number(e.value)||0);calculate()}));$("rows").querySelectorAll("[data-name]").forEach(e=>e.addEventListener("input",()=>config.items[+e.dataset.name][0]=e.value));$("rows").querySelectorAll("[data-del]").forEach(e=>e.addEventListener("click",()=>{if(confirm(`Eliminar ${config.items[+e.dataset.del][0]}?`)){config.items.splice(+e.dataset.del,1);render()}}));$("wholesaleMult").oninput=e=>{config.wholesale=Math.max(0,Number(e.target.value)||0);calculate()};$("publicMult").oninput=e=>{config.public=Math.max(0,Number(e.target.value)||0);calculate()};calculate();}
function calculate(){let sum=0;config.items.forEach((it,i)=>{let q=Math.max(0,Number(document.querySelector(`[data-qty="${i}"]`)?.value)||0),sub=q*(Number(it[1])||0);sum+=sub;let el=$("t"+i);if(el)el.textContent=money(sub);quantities[i]=q});$("grandTotal").textContent=money(sum);$("wholesaleTotal").textContent=money(sum*config.wholesale);$("chargeTotal").textContent=money(sum*config.public)}
async function init(){
  render();
  try{
    onSnapshot(docRef,(s)=>{
      if(s.exists() && s.data().items?.length>0){
        config={items:s.data().items,wholesale:s.data().wholesale??2.3,public:s.data().public??2.7};
        $("status").textContent="● Firebase ✓"; $("status").style.color="#00ff88";
        render();
      } else {
        setDoc(docRef, config);
        $("status").textContent="● Firebase ✓";
      }
    },(err)=>{
      $("status").textContent="● Error - revisa Rules Firebase";
      console.error(err);
    });
  }catch(e){ $("status").textContent="● Offline"; }
}
async function save(){
  document.querySelectorAll("[data-name]").forEach(e=>config.items[+e.dataset.name][0]=e.value.trim()||"NUEVO");
  document.querySelectorAll("[data-price]").forEach(e=>config.items[+e.dataset.price][1]=Math.max(0,Number(e.value)||0));
  try{await setDoc(docRef, config); alert("✅ Guardado y sincronizado para TODOS");}catch(err){alert("Error: "+err.message)}
}
$("adminBtn").onclick=()=>{if(isAdmin){save();isAdmin=false;render()}else{$("login").style.display="flex"}};
$("loginBtn").onclick=()=>{if($("username").value.toLowerCase().trim()==="inventa"&&$("password").value==="1234"){isAdmin=true;$("login").style.display="none";render()}else $("loginError").textContent="Incorrecto";};
$("closeLoginBtn").onclick=()=>$("login").style.display="none";
$("addBtn").onclick=()=>{config.items.push(["NUEVO",0]);render()};
$("saveBtn").onclick=save;
$("resetBtn").onclick=()=>{quantities={};document.querySelectorAll("[data-qty]").forEach(e=>e.value="");calculate()};
init();
</script></body></html>
