<style>
*{box-sizing:border-box}html{margin:0;min-height:100%;background:#05040a;background-color:#05040a}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
body{min-height:100vh;background-color:#05040a;background-image:radial-gradient(ellipse at 50% 42%,#321052 0,#170b27 42%,#05040a 82%);background-repeat:no-repeat;background-attachment:fixed;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.65;background-image:radial-gradient(circle at 4% 22%,#19e8dc 0 2px,transparent 4px),radial-gradient(circle at 91% 39%,#f4b52e 0 3px,transparent 6px),radial-gradient(circle at 17% 72%,#d83bff 0 2px,transparent 5px),radial-gradient(circle at 80% 81%,#25e9d8 0 2px,transparent 5px),radial-gradient(circle at 60% 15%,#b83cff 0 2px,transparent 5px),linear-gradient(125deg,transparent 0 20%,#6a2a8a22 20.1% 20.2%,transparent 20.3% 100%)}
main{width:min(100%,650px);margin:auto;padding:28px 20px 40px;position:relative;z-index:1}
.brand{display:flex;flex-direction:column;align-items:center;margin:4px auto 48px;text-align:center}
.brand img{width:min(48vw,260px);aspect-ratio:1;object-fit:cover;border-radius:50%;border:4px solid #d9d4e9;box-shadow:0 0 20px #20e8d8aa,0 0 55px #a42aff66}
.brand h1{font-size:clamp(26px,7vw,42px);letter-spacing:2px;margin:12px 0 0;text-shadow:0 2px 12px #000}
.brand p{font-weight:800;letter-spacing:1px;margin:0;color:#eee}
nav{display:grid;gap:22px}
nav a{min-height:112px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#fff;font-size:clamp(21px,5vw,30px);font-weight:500;padding:18px;border:1.5px solid #e7dcedaa;border-radius:18px;background:linear-gradient(110deg,#ffffff22,#ffffff0b 55%,#8e43a322);box-shadow:0 12px 28px #0007,inset 0 1px 16px #ffffff14;backdrop-filter:blur(12px);position:relative;overflow:hidden}
nav a:before{content:"";position:absolute;left:0;top:0;bottom:0;width:11px;background:linear-gradient(#31f5e4,#ad42ff)}
nav a:nth-child(2):before{background:linear-gradient(#b735ff,#ff4b9a)}
nav a:nth-child(3):before{background:linear-gradient(#ff4d9b,#ffcb31)}
nav a:nth-child(4):before{background:linear-gradient(#ffdf38,#b4e83c)}
nav a:active{transform:scale(.985);background:#ffffff30}
footer{text-align:center;color:#aaa;font-size:12px;margin-top:26px}
@media(min-width:700px){main{padding-top:36px}.brand{margin-bottom:55px}nav a{min-height:120px}}
