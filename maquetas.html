<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1a0b33"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>Calculadora de maquetas - INVENTA</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}html{background:#1a0b33}body{background:#1a0b33;color:#fff;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#0006;position:sticky;top:0;z-index:20}.logo-top{display:flex;gap:9px;align-items:center}.logo-top img{width:40px;height:40px;border-radius:50%}.btn-login{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;border:0;padding:9px 14px;border-radius:10px;font-weight:800}.back{display:block;color:#ddd;text-decoration:none;padding:10px 14px}.hero{display:flex;justify-content:center;padding:14px}.biglogo{width:120px;height:120px;border-radius:50%;overflow:hidden;border:3px solid #ffffff40}.biglogo img{width:100%;height:100%;object-fit:cover}.main{max-width:1150px;margin:auto;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;padding:12px}@media(max-width:800px){.main{grid-template-columns:1fr}}.card{background:#2e1065ee;border:1px solid #ffffff18;border-radius:18px;padding:13px}.inp-maqueta{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff25;background:#1e0f44;color:#fff;text-align:center;font-size:18px;font-weight:700;text-transform:uppercase}.inp-lugar{width:100%;margin-top:8px;padding:10px;border-radius:12px;border:1px solid #ffffff25;background:#1e0f44;color:#c4b5fd}.precios{display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;overflow:hidden;border:1px solid #ffffff20}.precios div{padding:9px;text-align:center;background:#1e0f44}.tabla{margin-top:12px;border:1px solid #ffffff18;border-radius:12px;overflow:hidden}.tabla-head{padding:10px;text-align:center;font-weight:800;background:#ffffff0c}.tabla-row{display:grid;grid-template-columns:1fr 82px 70px 34px;background:#1e0f44;border-bottom:1px solid #ffffff0f}.tabla-row input{border:0;border-right:1px solid #ffffff12;padding:10px 6px;background:transparent;color:#fff;width:100%}.btn-guardar{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-weight:900}.btn-trabajo{background:#10b981;color:#fff}.btn-materiales{background:#f59e0b;color:#000}.btn-limpiar{background:transparent;border:1px solid #ffffff25;color:#c4b5fd;padding:8px 12px;border-radius:10px}.guardadas{border:1px solid #ffffff18;border-radius:18px;background:#1e0f44cc;min-height:150px}.guardadas-head{padding:12px;text-align:center;border-bottom:1px solid #ffffff12;font-weight:800}.saved-item{padding:10px;border-bottom:1px solid #ffffff16;display:flex;justify-content:space-between}.saved-item button{background:#6d28d9;color:white;border:0;border-radius:7px;padding:7px}.hidden{display:none!important}.admin-only{display:none}.is-admin .admin-only{display:block}.login-panel{position:fixed;top:66px;right:12px;width:280px;background:#1e0f44;border:1px solid #a855f7;border-radius:14px;padding:12px;z-index:99}.login-panel input{width:100%;padding:10px;margin-top:7px;border-radius:9px;border:1px solid #ffffff25;background:#2a0a4a;color:#fff}.login-panel button{width:100%;margin-top:8px;padding:10px;border-radius:9px;border:0}.admin-add{width:100%;padding:10px;background:#ffffff08;color:#c4b5fd;border:0;border-top:1px solid #ffffff15}
</style></head><body>
<header><div class="logo-top"><img src="./icons/icon-192.png"><div><b>INVENTA MANUALIDADES</b><br><small style="color:#c4b5fd">PRECIOS MAQUETAS</small></div></div><button id="btnLogin" class="btn-login">ADMIN</button></header><a class="back" href="./index.html">← Menú principal</a>
<div id="loginPanel" class="login-panel hidden"><b style="color:#f472b6">ACCESO ADMINISTRADOR</b><input id="lUser" placeholder="Usuario"><input id="lPass" type="password" placeholder="Clave"><button id="btnDoLogin" class="btn-login">ENTRAR</button><button id="btnCloseLogin" style="background:#ffffff10;color:#fff">CERRAR</button><small id="loginError" style="color:#fca5a5"></small></div>
<div id="view1"><div class="hero"><div class="biglogo"><img src="./icons/icon-512.png"></div></div><div class="main"><div><div class="card"><div style="display:grid;grid-template-columns:1fr 320px;gap:12px"><div><input id="fMaqueta" class="inp-maqueta" placeholder="EJ: CASA 2 PISOS"><input id="fLugar" class="inp-lugar" placeholder="📍 LUGAR DE ENTREGA"></div><div><div style="text-align:center;font-size:12px;color:#c4b5fd;margin-bottom:6px">PRECIO <span id="syncStatus">● conectando</span></div><div class="precios"><div><small>INVERSIÓN</small><b id="pInv">S/ 0.00</b></div><div><small>MAYOR x2.5</small><b id="pMayor">S/ 0.00</b></div><div><small>PÚBLICO x3</small><b id="pPublico">S/ 0.00</b></div></div></div></div><div style="display:flex;justify-content:space-between;margin-top:14px"><div>LISTA DE MATERIALES</div><button id="btnLimpiar" class="btn-limpiar">🧹 Limpiar</button></div><div class="tabla"><div id="tablaBody"></div><button id="btnAddMat" class="admin-only admin-add">+ Agregar material</button></div><button id="btnGuardarTrabajo" class="btn-guardar btn-trabajo">GUARDAR TRABAJO</button><button id="btnGuardarMateriales" class="btn-guardar btn-materiales admin-only">GUARDAR MATERIALES BASE (SYNC)</button></div></div><div><div class="guardadas"><div class="guardadas-head">TRABAJOS GUARDADOS - EN VIVO</div><div id="listaGuardadas"></div></div></div></div></div>
<div id="view2" class="hidden" style="max-width:800px;margin:auto;padding:12px"><button id="btnAtras" style="background:#facc15;color:#000;border:0;padding:8px 12px;border-radius:8px;font-weight:800">◀ ATRÁS</button><div class="card" style="margin-top:12px"><div id="vNombre" class="inp-maqueta"></div><div id="vLugar" style="text-align:center;color:#c4b5fd;margin-top:6px"></div><div class="precios" style="margin-top:10px"><div><small>INV</small><b id="vInv"></b></div><div><small>MAYOR</small><b id="vMayor"></b></div><div><small>PÚBLICO</small><b id="vPublico"></b></div></div><div class="tabla"><div class="tabla-head" id="vMatTitle"></div><div id="vTabla"></div></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCmSEMVVBmrxRGOIQ9vJkghqkpqR_gKYis", authDomain: "manualidades-pwa.firebaseapp.com", projectId: "manualidades-pwa", storageBucket: "manualidades-pwa.firebasestorage.app", messagingSenderId: "729918672131", appId: "1:729918672131:web:e29b58a7f89eaeed5ead36" };
const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);
const matDocRef = doc(db, "inventa_config", "maquetas");
const trabajosCol = collection(db, "maquetas_trabajos");
const DEFAULT_MATS=[{nombre:"Tecnopor",precio:"6",cant:""},{nombre:"Microporoso",precio:"5",cant:""},{nombre:"Impresion",precio:"1",cant:""},{nombre:"Cartulina",precio:"1",cant:""},{nombre:"Tempera Apu",precio:"2",cant:""},{nombre:"Silicona",precio:"1",cant:""}];
const $=id=>document.getElementById(id),fmt=n=>"S/ "+(Number(n)||0).toFixed(2),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let materiales=[],guardadas=[],admin=false;
function calc(){let inv=materiales.reduce((s,m)=>s+(Number(m.precio||0)*Number(m.cant||0)),0);$("pInv").textContent=fmt(inv);$("pMayor").textContent=fmt(inv*2.5);$("pPublico").textContent=fmt(inv*3);return inv}
function renderTabla(){document.body.classList.toggle("is-admin",admin);$("btnLogin").textContent=admin?"SALIR":"ADMIN";$("tablaBody").innerHTML=materiales.map((m,i)=>`<div class="tabla-row"><input ${admin?"":"readonly"} value="${esc(m.nombre)}" data-n="${i}" placeholder="NOMBRE"><input ${admin?"":"readonly"} type="number" value="${esc(m.precio)}" data-p="${i}"><input type="number" value="${esc(m.cant)}" data-c="${i}" placeholder="0"><button class="admin-only" data-del="${i}" style="background:transparent;border:0;color:#f472b6">✕</button></div>`).join("");$("tablaBody").querySelectorAll("[data-n]").forEach(e=>e.oninput=()=>{if(admin)materiales[+e.dataset.n].nombre=e.value});$("tablaBody").querySelectorAll("[data-p]").forEach(e=>e.oninput=()=>{if(admin){materiales[+e.dataset.p].precio=e.value;calc()}});$("tablaBody").querySelectorAll("[data-c]").forEach(e=>e.oninput=()=>{materiales[+e.dataset.c].cant=e.value;calc()});$("tablaBody").querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>{if(admin){materiales.splice(+e.dataset.del,1);renderTabla();calc()}});calc()}
function renderGuardadas(){$("listaGuardadas").innerHTML=guardadas.length?guardadas.map((g,i)=>`<div class="saved-item"><div><b>${esc(g.nombre)}</b><br><small>📍 ${esc(g.lugar||"")}</small><br><small>${fmt(g.inv)} | ${fmt(g.mayor)} | ${fmt(g.publico)}</small></div><div><button data-open="${i}">Abrir</button> <button data-remove="${i}" ${admin?"":"style='display:none'"}>✕</button></div></div>`).join(""):'<p style="padding:18px;text-align:center;color:#c4b5fd">Sin trabajos.</p>';$("listaGuardadas").querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>openG(+e.dataset.open));$("listaGuardadas").querySelectorAll("[data-remove]").forEach(async e=>e.onclick=async()=>{if(admin&&confirm("Eliminar?")){await deleteDoc(doc(db,"maquetas_trabajos",guardadas[+e.dataset.remove].id))}})}
function openG(i){let g=guardadas[i];$("view1").classList.add("hidden");$("view2").classList.remove("hidden");$("vNombre").textContent=g.nombre;$("vLugar").textContent=g.lugar;$("vMatTitle").textContent="MATERIALES DE "+g.nombre;$("vInv").textContent=fmt(g.inv);$("vMayor").textContent=fmt(g.mayor);$("vPublico").textContent=fmt(g.publico);$("vTabla").innerHTML=g.materiales.map(m=>`<div class="tabla-row"><div style="padding:10px">${esc(m.nombre)}</div><div style="padding:10px">${fmt(m.precio)}</div><div style="padding:10px">${esc(m.cant)}</div><div></div></div>`).join("")}
$("btnAtras").onclick=()=>{$("view2").classList.add("hidden");$("view1").classList.remove("hidden")};
$("btnLimpiar").onclick=()=>{materiales.forEach(m=>m.cant="");$("fMaqueta").value="";$("fLugar").value="";renderTabla()};
$("btnGuardarTrabajo").onclick=async()=>{let nombre=$("fMaqueta").value.trim(),lugar=$("fLugar").value.trim(),inv=calc();if(!nombre)return alert("Nombre");if(inv<=0)return alert("Cantidades");let mats=materiales.filter(m=>m.nombre&&Number(m.cant)>0).map(m=>({...m}));await addDoc(trabajosCol,{nombre,lugar,materiales:mats,inv,mayor:inv*2.5,publico:inv*3,fecha:Date.now()});$("fMaqueta").value="";$("fLugar").value="";materiales.forEach(m=>m.cant="");renderTabla()};
$("btnGuardarMateriales").onclick=async()=>{if(!admin)return;let base=materiales.map(m=>({nombre:m.nombre,precio:m.precio,cant:""}));await setDoc(matDocRef,{items:base});alert("✅ Guardado para todos")};
$("btnAddMat").onclick=()=>{if(admin){materiales.push({nombre:"",precio:"",cant:""});renderTabla()}};
$("btnLogin").onclick=()=>{if(admin){admin=false;renderTabla();renderGuardadas()}else{$("loginPanel").classList.remove("hidden")}};
$("btnCloseLogin").onclick=()=>$("loginPanel").classList.add("hidden");
$("btnDoLogin").onclick=()=>{if($("lUser").value.toLowerCase()==="inventa"&&$("lPass").value==="1234"){admin=true;$("loginPanel").classList.add("hidden");renderTabla();renderGuardadas()}else $("loginError").textContent="Incorrecto";};
async function init(){
  materiales=JSON.parse(JSON.stringify(DEFAULT_MATS));renderTabla();
  try{
    onSnapshot(matDocRef,(s)=>{if(s.exists()&&s.data().items?.length){let cantMap={};materiales.forEach(m=>{if(m.cant)cantMap[m.nombre]=m.cant});materiales=s.data().items.map(r=>({...r,cant:cantMap[r.nombre]||""}));renderTabla();$("syncStatus").textContent="● Firebase ✓";$("syncStatus").style.color="#00ff88";}else{$("syncStatus").textContent="● Firebase ✓"}});
    const q=query(trabajosCol, orderBy("fecha","desc"));
    onSnapshot(q,(qs)=>{guardadas=qs.docs.map(d=>({id:d.id,...d.data()}));renderGuardadas();});
  }catch(e){$("syncStatus").textContent="● Error";console.log(e);}
}
init();
</script></body></html>
