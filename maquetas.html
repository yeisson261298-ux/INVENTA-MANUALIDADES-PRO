<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a0b33"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>Calculadora de maquetas - INVENTA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}html{background:#1a0b33;background-color:#1a0b33}body{background-color:#1a0b33;background-image:radial-gradient(100% at 20% 0%,#5b21b6 0%,#1a0b33 60%);background-repeat:no-repeat;background-attachment:fixed;background-size:cover;color:#fff;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:#0006;border-bottom:1px solid #ffffff15;position:sticky;top:0;z-index:20}.logo-top{display:flex;gap:9px;align-items:center}.logo-top img{width:40px;height:40px;border-radius:50%}.btn-login{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;border:0;padding:9px 14px;border-radius:10px;font-weight:800}.back{display:block;color:#ddd;text-decoration:none;padding:10px 14px;font-size:13px}.hero{display:flex;justify-content:center;padding:14px}.biglogo{width:120px;height:120px;border-radius:50%;overflow:hidden;border:3px solid #ffffff40}.biglogo img{width:100%;height:100%;object-fit:cover}.main{max-width:1150px;margin:auto;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;padding:12px}@media(max-width:800px){.main{grid-template-columns:1fr}}.card{background:linear-gradient(180deg,#2e1065ee,#3b1a7aee);border:1px solid #ffffff18;border-radius:18px;padding:13px}.title-row{display:grid;grid-template-columns:1fr 320px;gap:12px}@media(max-width:700px){.title-row{grid-template-columns:1fr}}.inp-maqueta{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff25;background:#1e0f44;color:#fff;text-align:center;font-size:18px;font-weight:700;text-transform:uppercase}.precios{display:grid;grid-template-columns:repeat(3,1fr);border-radius:12px;overflow:hidden;border:1px solid #ffffff20}.precios div{padding:9px 3px;text-align:center;background:#1e0f44;min-width:0}.precios small{font-size:10px}.precios b{display:block;margin-top:4px;font-size:13px}.tabla{margin-top:12px;border:1px solid #ffffff18;border-radius:12px;overflow:hidden}.tabla-head{padding:10px;text-align:center;font-weight:800;border-bottom:1px solid #ffffff15;background:#ffffff0c}.tabla-row{display:grid;grid-template-columns:minmax(0,1fr) 82px 70px 34px;background:#1e0f44;border-bottom:1px solid #ffffff0f}.tabla-row input{min-width:0;border:0;border-right:1px solid #ffffff12;padding:10px 6px;background:transparent;color:#fff;width:100%;font-size:13px}.tabla-row input[readonly]{opacity:1}.btn-guardar{width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-weight:900;font-size:15px}.btn-trabajo{background:linear-gradient(135deg,#10b981,#059669);color:#fff}.btn-materiales{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000}.btn-limpiar{background:transparent;border:1px solid #ffffff25;color:#c4b5fd;padding:8px 12px;border-radius:10px;font-size:12px}.guardadas{border:1px solid #ffffff18;border-radius:18px;background:#1e0f44cc;min-height:150px;overflow:hidden}.guardadas-head{padding:12px;text-align:center;border-bottom:1px solid #ffffff12;font-weight:800}.saved-item{padding:10px;border-bottom:1px solid #ffffff16;display:flex;justify-content:space-between;gap:8px;align-items:center}.saved-item button{background:#6d28d9;color:white;border:0;border-radius:7px;padding:7px}.hidden{display:none!important}.admin-only{display:none}.is-admin .admin-only{display:block}.login-panel{position:fixed;top:66px;right:12px;width:min(280px,calc(100% - 24px));background:#1e0f44;border:1px solid #a855f7;border-radius:14px;padding:12px;z-index:99;box-shadow:0 12px 30px #0008}.login-panel input{width:100%;padding:10px;margin-top:7px;border-radius:9px;border:1px solid #ffffff25;background:#2a0a4a;color:#fff}.login-panel button{width:100%;margin-top:8px;padding:10px;border-radius:9px;border:0}.admin-add{width:100%;padding:10px;background:#ffffff08;color:#c4b5fd;border:0;border-top:1px solid #ffffff15}
</style></head><body>
<header><div class="logo-top"><img src="./icons/icon-192.png" alt=""><div><b>INVENTA MANUALIDADES</b><br><small style="color:#c4b5fd">PRECIOS MAQUETAS</small></div></div><button id="btnLogin" class="btn-login">ADMIN</button></header><a class="back" href="./index.html">← Menú principal</a>
<div id="loginPanel" class="login-panel hidden"><b style="color:#f472b6">ACCESO ADMINISTRADOR</b><input id="lUser" placeholder="Usuario" autocomplete="username"><input id="lPass" type="password" placeholder="Clave" autocomplete="current-password"><button id="btnDoLogin" class="btn-login">ENTRAR</button><button id="btnCloseLogin" style="background:#ffffff10;color:#fff">CERRAR</button><small id="loginError" style="color:#fca5a5"></small></div>
<div id="view1"><div class="hero"><div class="biglogo"><img src="./icons/icon-512.png" alt="INVENTA"></div></div><div class="main"><div><div class="card"><div class="title-row"><div><div style="font-size:11px;color:#c4b5fd;margin-bottom:4px">MAQUETA / MANUALIDAD</div><input id="fMaqueta" class="inp-maqueta" placeholder="EJ: CASA 2 PISOS"></div><div><div style="text-align:center;font-size:12px;color:#c4b5fd;margin-bottom:6px">PRECIO</div><div class="precios"><div><small>INVERSIÓN</small><b id="pInv">S/ 0.00</b></div><div><small>MAYOR x2.5</small><b id="pMayor">S/ 0.00</b></div><div><small>PÚBLICO x3</small><b id="pPublico">S/ 0.00</b></div></div></div></div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px"><div class="tabla-head" style="border:0;background:transparent;padding:0">LISTA DE MATERIALES</div><button id="btnLimpiar" class="btn-limpiar">🧹 Limpiar cantidades</button></div><div class="tabla"><div id="tablaBody"></div><button id="btnAddMat" class="admin-only admin-add">+ Agregar material</button></div><button id="btnGuardarTrabajo" class="btn-guardar btn-trabajo">GUARDAR TRABAJO</button><button id="btnGuardarMateriales" class="btn-guardar btn-materiales admin-only">GUARDAR MATERIALES BASE</button></div></div>
<div><div class="guardadas"><div class="guardadas-head">TRABAJOS GUARDADOS</div><div id="listaGuardadas"></div></div></div></div></div>
<div id="view2" class="hidden" style="max-width:800px;margin:auto;padding:12px"><button id="btnAtras" style="background:#facc15;color:#000;border:0;padding:8px 12px;border-radius:8px;font-weight:800">◀ ATRÁS</button><div class="hero"><div class="biglogo"><img src="./icons/icon-512.png" alt=""></div></div><div class="card"><div id="vNombre" class="inp-maqueta"></div><div class="precios" style="margin-top:10px"><div><small>INV</small><b id="vInv"></b></div><div><small>MAYOR</small><b id="vMayor"></b></div><div><small>PÚBLICO</small><b id="vPublico"></b></div></div><div class="tabla"><div class="tabla-head" id="vMatTitle"></div><div id="vTabla"></div></div></div></div>
<script>
const DEFAULT_MATS=[{nombre:"Tecnopor",precio:"6",cant:""},{nombre:"Microporoso",precio:"5",cant:""},{nombre:"Impresion",precio:"1",cant:""},{nombre:"Cartulina",precio:"1",cant:""},{nombre:"Tempera Apu",precio:"2",cant:""},{nombre:"Silicona",precio:"1",cant:""},...Array.from({length:8},()=>({nombre:"",precio:"",cant:""}))];
const LS_MAT="inventa_maquetas_materiales_v2",LS_TRAB="inventa_maquetas_trabajos_v2",AUTH="inventa_maquetas_admin_v2";let materiales=read(LS_MAT,DEFAULT_MATS),guardadas=read(LS_TRAB,[]),admin=false;
function read(k,d){try{let v=JSON.parse(localStorage.getItem(k));return v??JSON.parse(JSON.stringify(d))}catch(e){return JSON.parse(JSON.stringify(d))}}
const $=id=>document.getElementById(id),fmt=n=>"S/ "+(Number(n)||0).toFixed(2),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function calc(){let inv=materiales.reduce((s,m)=>s+(Math.max(0,Number(m.precio)||0)*Math.max(0,Number(m.cant)||0)),0);$("pInv").textContent=fmt(inv);$("pMayor").textContent=fmt(inv*2.5);$("pPublico").textContent=fmt(inv*3);return inv}
function renderTabla(){document.body.classList.toggle("is-admin",admin);$("btnLogin").textContent=admin?"SALIR":"ADMIN";$("tablaBody").innerHTML=materiales.map((m,i)=>`<div class="tabla-row"><input ${admin?"":"readonly"} placeholder="NOMBRE" value="${esc(m.nombre)}" data-n="${i}"><input ${admin?"":"readonly"} placeholder="PRECIO" type="number" min="0" step=".01" value="${esc(m.precio)}" data-p="${i}"><input placeholder="0" type="number" min="0" step="any" value="${esc(m.cant)}" data-c="${i}"><button class="admin-only" data-del="${i}" style="background:transparent;border:0;color:#f472b6">✕</button></div>`).join("");$("tablaBody").querySelectorAll("[data-n]").forEach(e=>e.oninput=()=>{if(admin)materiales[+e.dataset.n].nombre=e.value});$("tablaBody").querySelectorAll("[data-p]").forEach(e=>e.oninput=()=>{if(admin){materiales[+e.dataset.p].precio=e.value;calc()}});$("tablaBody").querySelectorAll("[data-c]").forEach(e=>e.oninput=()=>{materiales[+e.dataset.c].cant=e.value;calc()});$("tablaBody").querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>{if(admin&&confirm("¿Eliminar este material?")){materiales.splice(+e.dataset.del,1);renderTabla();calc()}});calc()}
function renderGuardadas(){$("listaGuardadas").innerHTML=guardadas.length?guardadas.map((g,i)=>`<div class="saved-item"><div><b>${esc(g.nombre)}</b><br><small>${fmt(g.inv)} | Mayor ${fmt(g.mayor)} | Público ${fmt(g.publico)}</small></div><div><button data-open="${i}">Abrir</button> <button data-remove="${i}" ${admin?"":"style='display:none'"}>✕</button></div></div>`).join(""):'<p style="padding:18px;text-align:center;color:#c4b5fd;font-size:12px">Todavía no hay trabajos guardados.</p>';$("listaGuardadas").querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>openG(+e.dataset.open));$("listaGuardadas").querySelectorAll("[data-remove]").forEach(e=>e.onclick=()=>{if(admin&&confirm("¿Eliminar trabajo guardado?")){guardadas.splice(+e.dataset.remove,1);localStorage.setItem(LS_TRAB,JSON.stringify(guardadas));renderGuardadas()}})}
function openG(i){let g=guardadas[i];$("view1").classList.add("hidden");$("view2").classList.remove("hidden");$("vNombre").textContent=g.nombre;$("vMatTitle").textContent="MATERIALES DE "+g.nombre;$("vInv").textContent=fmt(g.inv);$("vMayor").textContent=fmt(g.mayor);$("vPublico").textContent=fmt(g.publico);$("vTabla").innerHTML=g.materiales.map(m=>`<div class="tabla-row"><div style="padding:10px">${esc(m.nombre)}</div><div style="padding:10px">${fmt(m.precio)}</div><div style="padding:10px">${esc(m.cant||0)}</div><div></div></div>`).join("")}
$("btnAtras").onclick=()=>{$("view2").classList.add("hidden");$("view1").classList.remove("hidden")};
$("btnLimpiar").onclick=()=>{if(confirm("¿Limpiar cantidades?")){materiales.forEach(m=>m.cant="");$("fMaqueta").value="";renderTabla()}};
$("btnGuardarTrabajo").onclick=()=>{let nombre=$("fMaqueta").value.trim(),inv=calc();if(!nombre)return alert("Escribe el nombre del trabajo.");if(inv<=0)return alert("Ingresa cantidades para calcular el costo.");let mats=materiales.filter(m=>m.nombre&&Number(m.cant)>0).map(m=>({...m}));if(!mats.length)return alert("Agrega al menos una cantidad.");guardadas.unshift({nombre,materiales:mats,inv,mayor:inv*2.5,publico:inv*3});localStorage.setItem(LS_TRAB,JSON.stringify(guardadas));renderGuardadas();alert("Trabajo guardado.")};
$("btnGuardarMateriales").onclick=()=>{if(!admin)return;localStorage.setItem(LS_MAT,JSON.stringify(materiales.map(m=>({...m,cant:""}))));alert("Materiales base guardados.")};
$("btnAddMat").onclick=()=>{if(admin){materiales.push({nombre:"",precio:"",cant:""});renderTabla()}};
function showLogin(){$("loginPanel").classList.remove("hidden");$("loginError").textContent="";$("lUser").value="";$("lPass").value=""}
$("btnLogin").onclick=()=>{if(admin){admin=false;renderTabla();renderGuardadas()}else showLogin()};
$("btnCloseLogin").onclick=()=>$("loginPanel").classList.add("hidden");
$("btnDoLogin").onclick=()=>{if($("lUser").value.trim().toLowerCase()==="inventa"&&$("lPass").value==="1234"){admin=true;$("loginPanel").classList.add("hidden");renderTabla();renderGuardadas()}else $("loginError").textContent="Usuario o clave incorrectos."};
$("lPass").onkeydown=e=>{if(e.key==="Enter")$("btnDoLogin").click()};
renderTabla();renderGuardadas();
</script></body></html>
