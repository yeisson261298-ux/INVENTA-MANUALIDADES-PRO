<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12384a"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><title>Nota de pedidos - INVENTA</title>
<style>
:root{--azul:#12384a;--azul2:#1c4c63;--oro:#c9a24b;--crema:#f2ecd9;--fondo:#eef3f4}*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:var(--fondo);color:#1c2b33;padding-bottom:35px}.back{display:block;max-width:480px;margin:auto;padding:12px 14px;color:#164c63;text-decoration:none;font:13px system-ui}.hoja{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;padding:14px;border-top:6px solid var(--oro)}h1{text-align:center;color:var(--azul2);letter-spacing:2px;font-size:1.45em;margin:6px 0 14px}.marca{text-align:center;margin-bottom:14px}.marca .logo{font:bold italic 2.1em Arial;color:var(--azul2);-webkit-text-stroke:1px var(--oro);line-height:1}.marca .sub{font-weight:bold;color:#8b3fa8;letter-spacing:1px}.marca .tag{font-size:.72em;color:var(--azul2);font-weight:bold;letter-spacing:1px}.caja{border:2px solid var(--oro);border-radius:8px;background:var(--azul);padding:8px 10px;margin-bottom:10px}.caja label{color:var(--crema);font-weight:bold;font-size:.9em;display:block;margin-bottom:4px}.fila-inline{display:flex;align-items:center;gap:8px}.fila-inline label{margin:0;white-space:nowrap}input[type=text],input[type=tel],input[type=number],input[type=date]{width:100%;min-width:0;border:1px solid #cfd6da;border-radius:5px;background:#fff;padding:7px 8px;font-size:1em;font-family:inherit;color:#1c2b33}input:focus{outline:2px solid var(--oro)}table{width:100%;border-collapse:collapse;margin-bottom:10px}thead th{background:var(--azul);color:var(--crema);border:1px solid var(--oro);padding:6px 4px;font-size:.85em}tbody td{border:1px solid var(--azul2);padding:4px}tbody td input{border:0!important;border-bottom:1px dotted #999!important;border-radius:0!important;text-align:center;padding:6px 2px!important}.col-cant{width:20%}.col-prod{width:52%}.col-total{width:28%}.btn-fila{display:flex;justify-content:center;gap:10px;margin:-4px 0 14px}.btn-fila button{border:0;background:var(--azul2);color:#fff;padding:7px 14px;border-radius:6px}.fila-dos{display:flex;gap:10px}.fila-dos .caja{flex:1}.metodo-pago{display:flex;flex-direction:column;gap:6px}.metodo-pago .op{display:flex;align-items:center;gap:8px;color:var(--crema);font-weight:bold}.metodo-pago input{width:20px;height:20px}.resumen{display:flex;justify-content:space-between;color:var(--crema);font-weight:bold;margin-top:4px}.footer{text-align:center;margin-top:16px;font-weight:bold;font-size:.9em}.acciones,.acciones2{display:flex;gap:8px;margin-top:10px}.acciones button,.acciones2 button{flex:1;padding:11px;border:0;border-radius:8px;font-size:.9em;font-weight:bold;color:#fff}#btnGuardar{background:#2e7d4f}#btnWhatsapp{background:#25D366}#btnNuevo{background:#a33b3b}#btnImprimir{background:var(--azul2)}#btnImagen{background:#25D366}.acciones2 button{background:#555}.lista-guardadas{margin-top:18px}.pedido-guardado{border:1px solid #ccc;border-radius:6px;padding:8px;margin-bottom:6px;font-size:.82em;display:flex;align-items:center;gap:6px}.pedido-guardado .info{flex:1;min-width:0}.pedido-guardado button{border:0;border-radius:5px;padding:6px 8px;color:#fff}.abrir{background:var(--azul2)}.borrar{background:#a33b3b}.adminbar{display:flex;justify-content:space-between;max-width:480px;margin:auto;padding:0 14px;align-items:center}.adminbar button{background:#172b36;color:white;border:1px solid #c9a24b;padding:8px 12px;border-radius:8px}.admin-settings{max-width:480px;margin:8px auto;padding:10px 14px;background:#172b36;color:white;display:none}.admin-settings input{margin:5px 0}.is-admin .admin-settings{display:block}.is-admin .borrar{display:inline-block}@media print{.back,.adminbar,.admin-settings,.acciones,.acciones2,.btn-fila,.lista-guardadas,h2.tit-lista{display:none!important}body{background:#fff}.hoja{border:0}}
</style></head><body><a class="back" href="./index.html">← Menú principal</a><div class="adminbar"><span id="syncStatus" style="font-size:11px;color:#12384a">● cargando</span><button id="adminBtn">ADMIN</button></div><div class="admin-settings" id="adminSettings"><b>Configuración administrativa (se sincroniza)</b><label>Contacto 1<input id="contact1" type="tel"></label><label>Contacto 2<input id="contact2" type="tel"></label><button id="saveAdmin">Guardar configuración</button></div>
<div class="hoja"><h1>NOTA DE PEDIDO</h1><div class="marca"><div class="logo">INVENTA</div><div class="sub">MANUALIDADES</div><div class="tag">CIENCIA Y ARTE EN CADA PROYECTO</div></div>
<div class="caja"><div class="fila-inline"><label for="fecha">Fecha de orden:</label><input type="date" id="fecha"></div></div><div class="caja"><label for="cliente">Cliente:</label><input type="text" id="cliente" placeholder="Nombre del cliente"><div style="height:8px"></div><label for="telefono">Teléfono:</label><input type="tel" id="telefono" placeholder="Número de contacto"></div>
<table><thead><tr><th class="col-cant">Cantidad</th><th class="col-prod">Producto</th><th class="col-total">Total</th></tr></thead><tbody id="filasProductos"></tbody></table><div class="btn-fila"><button id="btnAgregarFila">+ Agregar fila</button><button id="btnQuitarFila">- Quitar fila</button></div>
<div class="caja"><label for="entrega">Modo de entrega</label><input type="text" id="entrega" placeholder="Recojo en tienda / Delivery / etc."></div><div class="fila-dos"><div class="caja"><div class="fila-inline"><label for="precioTotal" style="flex:1">Precio total:</label><input type="number" id="precioTotal" step=".01" placeholder="0.00"></div><div class="fila-inline" style="margin-top:6px"><label for="adelanto" style="flex:1">Adelanto:</label><input type="number" id="adelanto" step=".01" placeholder="0.00"></div><div class="resumen"><span>Saldo:</span><span id="saldo">0.00</span></div></div></div>
<div class="caja"><label>Método de pago</label><div class="metodo-pago"><span class="op"><input type="checkbox" id="pagoYape"> YAPE/PLIN</span><span class="op"><input type="checkbox" id="pagoEfectivo"> EFECTIVO</span><span class="op"><input type="checkbox" id="pagoTransferencia"> TRANSFERENCIA</span></div></div>
<div class="footer">📲 Contacto: <span id="contactDisplay">991 002 150 / 992 166 152</span></div>
<div class="acciones"><button id="btnGuardar">💾 Guardar</button><button id="btnImprimir">🖨️ Imprimir/PDF</button></div><div class="acciones2"><button id="btnImagen">📷 Compartir imagen</button><button id="btnNuevo">🆕 Nuevo pedido</button></div><canvas id="canvasPedido" style="display:none"></canvas>
<div class="lista-guardadas"><h2 class="tit-lista" style="color:var(--azul2);font-size:1.05em">Pedidos guardados <small id="countPedidos"></small></h2><div id="listaPedidos"></div></div></div>
<div id="login" style="position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:100"><div style="background:#172b36;color:white;padding:20px;border-radius:14px;width:min(320px,100%)"><b>Acceso administrador</b><input id="user" placeholder="Usuario" style="display:block;width:100%;padding:10px;margin:8px 0"><input id="pass" type="password" placeholder="Clave" style="display:block;width:100%;padding:10px;margin:8px 0"><p id="loginError" style="color:#ffaaaa;font-size:12px"></p><button id="doLogin">ENTRAR</button> <button id="closeLogin">CERRAR</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCmSEMVVBmrxRGOIQ9vJkghqkpqR_gKYis", authDomain: "manualidades-pwa.firebaseapp.com", projectId: "manualidades-pwa", storageBucket: "manualidades-pwa.firebasestorage.app", messagingSenderId: "729918672131", appId: "1:729918672131:web:e29b58a7f89eaeed5ead36" };
const appFB = initializeApp(firebaseConfig);
const db = getFirestore(appFB);
const settingsRef = doc(db, "inventa_config", "pedidos");
const pedidosCol = collection(db, "inventa_pedidos");

const FILAS_INICIALES=6,tbody=document.getElementById("filasProductos"),CLAVE="inventa_notas_pedido_v2",SETKEY="inventa_nota_settings_v1";
let admin=false,settings={c1:"991 002 150",c2:"992 166 152"},pedidosLocal=[];
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function crearFila(cant="",prod="",total=""){let tr=document.createElement("tr");tr.innerHTML='<td><input type="text" class="in-cant"></td><td><input type="text" class="in-prod"></td><td><input type="number" step=".01" class="in-total"></td>';tr.querySelector(".in-cant").value=cant;tr.querySelector(".in-prod").value=prod;tr.querySelector(".in-total").value=total;tbody.appendChild(tr)}
function inicializarFilas(n){tbody.innerHTML="";for(let i=0;i<n;i++)crearFila()}
function saldo(){let t=Number($("precioTotal").value)||0,a=Number($("adelanto").value)||0;$("saldo").textContent=(t-a).toFixed(2)}
function $(id){return document.getElementById(id)}
function autoSumar(){let s=[...document.querySelectorAll(".in-total")].reduce((a,e)=>a+(Number(e.value)||0),0);$("precioTotal").value=s?s.toFixed(2):"";saldo()}
function leer(){return{fecha:$("fecha").value,cliente:$("cliente").value,telefono:$("telefono").value,filas:[...tbody.querySelectorAll("tr")].map(tr=>({cant:tr.querySelector(".in-cant").value,prod:tr.querySelector(".in-prod").value,total:tr.querySelector(".in-total").value})),entrega:$("entrega").value,precioTotal:$("precioTotal").value,adelanto:$("adelanto").value,pagoYape:$("pagoYape").checked,pagoEfectivo:$("pagoEfectivo").checked,pagoTransferencia:$("pagoTransferencia").checked,fechaCreacion:Date.now()}}
function cargar(p){$("fecha").value=p.fecha||"";$("cliente").value=p.cliente||"";$("telefono").value=p.telefono||"";tbody.innerHTML="";(p.filas||[]).forEach(f=>crearFila(f.cant,f.prod,f.total));if(!p.filas?.length)inicializarFilas(FILAS_INICIALES);$("entrega").value=p.entrega||"";$("precioTotal").value=p.precioTotal||"";$("adelanto").value=p.adelanto||"";$("pagoYape").checked=!!p.pagoYape;$("pagoEfectivo").checked=!!p.pagoEfectivo;$("pagoTransferencia").checked=!!p.pagoTransferencia;saldo()}

function renderLista(){
  let c=$("listaPedidos");
  let lista=pedidosLocal;
  $("countPedidos").textContent=lista.length?`(${lista.length})`:"";
  if(!lista.length){c.innerHTML='<p style="color:#888;font-size:.85em">Aún no hay pedidos guardados.</p>';return}
  c.innerHTML="";
  lista.forEach(p=>{
    let d=document.createElement("div");d.className="pedido-guardado";
    let info=document.createElement("div");info.className="info";
    info.innerHTML=`<b>${p.cliente||"(sin nombre)"}</b> · ${p.fecha||""}<br>S/ ${p.precioTotal||"0"} - Saldo S/ ${(Number(p.precioTotal||0)-Number(p.adelanto||0)).toFixed(2)}`;
    let abrir=document.createElement("button");abrir.className="abrir";abrir.textContent="Abrir";abrir.onclick=()=>{cargar(p);scrollTo({top:0,behavior:"smooth"})};
    let borrar=document.createElement("button");borrar.className="borrar";borrar.textContent="Borrar";borrar.style.display=admin?"inline-block":"none";
    borrar.onclick=async()=>{if(confirm("¿Borrar este pedido?")){try{if(p.id){await deleteDoc(doc(db,"inventa_pedidos",p.id))}else{let all=load(CLAVE,[]).filter(x=>x.id!==p.id);localStorage.setItem(CLAVE,JSON.stringify(all));pedidosLocal=all;renderLista()}}catch(e){alert("Error: "+e.message)}}};
    d.append(info,abrir,borrar);c.append(d)
  })
}

tbody.addEventListener("input",e=>{if(e.target.classList.contains("in-total"))autoSumar()});$("btnAgregarFila").onclick=()=>crearFila();$("btnQuitarFila").onclick=()=>{if(tbody.children.length>1)tbody.lastElementChild.remove();autoSumar()};$("precioTotal").oninput=saldo;$("adelanto").oninput=saldo;

$("btnGuardar").onclick=async()=>{
  let p=leer();if(!p.cliente.trim())return alert("Escribe el nombre del cliente.");
  $("btnGuardar").textContent="Guardando...";$("btnGuardar").disabled=true;
  try{
    await addDoc(pedidosCol, p);
    // backup local
    let local=load(CLAVE,[]);local.push({...p,id:Date.now()});localStorage.setItem(CLAVE,JSON.stringify(local));
    alert("✅ Pedido guardado y sincronizado en todos los equipos");
    $("btnNuevo").click();
  }catch(e){alert("Error Firebase: "+e.message+" - Se guardó local");
    let local=load(CLAVE,[]);local.push({...p,id:Date.now()});localStorage.setItem(CLAVE,JSON.stringify(local));pedidosLocal=local;renderLista();
  }
  $("btnGuardar").textContent="💾 Guardar";$("btnGuardar").disabled=false;
};

$("btnNuevo").onclick=()=>{if(!confirm("¿Empezar un pedido nuevo?"))return;$("fecha").value="";$("cliente").value="";$("telefono").value="";inicializarFilas(FILAS_INICIALES);$("entrega").value="";$("precioTotal").value="";$("adelanto").value="";["pagoYape","pagoEfectivo","pagoTransferencia"].forEach(id=>$(id).checked=false);saldo()};
$("btnImprimir").onclick=()=>window.print();
function dibujarCaja(ctx,x,y,w,h){ctx.fillStyle="#12384a";ctx.fillRect(x,y,w,h);ctx.strokeStyle="#c9a24b";ctx.lineWidth=2;ctx.strokeRect(x,y,w,h)}
function crearCanvas(p){let ancho=700,alto=640+p.filas.length*32,canvas=$("canvasPedido");canvas.width=ancho;canvas.height=alto;let ctx=canvas.getContext("2d"),y=46;ctx.fillStyle="#fff";ctx.fillRect(0,0,ancho,alto);ctx.strokeStyle="#c9a24b";ctx.lineWidth=6;ctx.strokeRect(6,6,ancho-12,alto-12);ctx.textAlign="center";ctx.fillStyle="#12384a";ctx.font="bold 30px Georgia";ctx.fillText("NOTA DE PEDIDO",350,y);y+=46;ctx.font="bold 34px Arial";ctx.fillText("INVENTA",350,y);y+=30;ctx.font="bold 20px Arial";ctx.fillText("MANUALIDADES",350,y);y+=42;dibujarCaja(ctx,30,y,640,34);ctx.fillStyle="#f2ecd9";ctx.textAlign="left";ctx.font="bold 16px Georgia";ctx.fillText("Fecha: "+(p.fecha||"-"),42,y+22);y+=50;dibujarCaja(ctx,30,y,640,68);ctx.fillText("Cliente: "+(p.cliente||"-"),42,y+26);ctx.fillText("Teléfono: "+(p.telefono||"-"),42,y+52);y+=84;let xs=[30,170,530],ws=[140,360,140],heads=["Cantidad","Producto","Total"];heads.forEach((h,i)=>{ctx.fillStyle="#12384a";ctx.fillRect(xs[i],y,ws[i],32);ctx.fillStyle="#f2ecd9";ctx.textAlign="center";ctx.font="bold 15px Georgia";ctx.fillText(h,xs[i]+ws[i]/2,y+21)});y+=32;p.filas.forEach(f=>{ctx.strokeStyle="#1c4c63";ctx.strokeRect(30,y,140,32);ctx.strokeRect(170,y,360,32);ctx.strokeRect(530,y,140,32);ctx.fillStyle="#1c2b33";ctx.font="14px Georgia";ctx.textAlign="center";ctx.fillText(f.cant||"",100,y+21);ctx.textAlign="left";ctx.fillText(String(f.prod||"").slice(0,45),180,y+21);ctx.textAlign="center";ctx.fillText(f.total?"S/ "+f.total:"",600,y+21);y+=32});y+=20;dibujarCaja(ctx,30,y,640,34);ctx.fillStyle="#f2ecd9";ctx.textAlign="left";ctx.font="bold 15px Georgia";ctx.fillText("Entrega: "+(p.entrega||"-"),42,y+22);y+=50;dibujarCaja(ctx,30,y,640,90);ctx.fillStyle="#f2ecd9";ctx.font="bold 16px Georgia";ctx.fillText("Precio total: S/ "+(p.precioTotal||"0.00"),42,y+26);ctx.fillText("Adelanto: S/ "+(p.adelanto||"0.00"),42,y+52);ctx.fillText("Saldo: S/ "+$("saldo").textContent,42,y+78);y+=106;let metodos=[];if(p.pagoYape)metodos.push("Yape/Plin");if(p.pagoEfectivo)metodos.push("Efectivo");if(p.pagoTransferencia)metodos.push("Transferencia");dibujarCaja(ctx,30,y,640,50);ctx.fillStyle="#f2ecd9";ctx.textAlign="center";ctx.fillText("Pago: "+(metodos.join(", ")||"-"),350,y+30);y+=70;ctx.fillStyle="#12384a";ctx.fillText("Contacto: "+settings.c1+" / "+settings.c2,350,y);return canvas}
$("btnImagen").onclick=()=>{let c=crearCanvas(leer());c.toBlob(async blob=>{if(!blob)return;let f=new File([blob],"nota-pedido-inventa.png",{type:"image/png"});if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],title:"Nota de pedido INVENTA"});return}catch(e){}}let u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);alert("Imagen descargada.")},"image/png")};
function applySettings(){$("contactDisplay").textContent=settings.c1+" / "+settings.c2;$("contact1").value=settings.c1;$("contact2").value=settings.c2}

$("adminBtn").onclick=()=>{if(admin){admin=false;document.body.classList.remove("is-admin");$("adminBtn").textContent="ADMIN";renderLista()}else{$("login").style.display="flex";$("loginError").textContent=""}};
$("closeLogin").onclick=()=>$("login").style.display="none";$("doLogin").onclick=()=>{if($("user").value.trim().toLowerCase()==="inventa"&&$("pass").value==="1234"){admin=true;document.body.classList.add("is-admin");$("adminBtn").textContent="SALIR";$("login").style.display="none";renderLista()}else $("loginError").textContent="Incorrecto";};
$("saveAdmin").onclick=async()=>{
  if(!admin)return;
  settings={c1:$("contact1").value.trim()||"991 002 150",c2:$("contact2").value.trim()||"992 166 152"};
  localStorage.setItem(SETKEY,JSON.stringify(settings));
  applySettings();
  try{await setDoc(settingsRef, settings); alert("✅ Contactos guardados y sincronizados");}catch(e){alert("Guardado local, error Firebase: "+e.message)}
};

async function init(){
  // 1. CARGA LOCAL INSTANTANEA
  try{
    settings=load(SETKEY,settings);applySettings();
    pedidosLocal=load(CLAVE,[]).sort((a,b)=>b.id-a.id);
  }catch(e){}
  inicializarFilas(FILAS_INICIALES);renderLista();$("syncStatus").textContent="● local ✓";

  // 2. FIREBASE EN SEGUNDO PLANO
  try{
    const sSnap=await getDoc(settingsRef);
    if(sSnap.exists()){settings=sSnap.data();localStorage.setItem(SETKEY,JSON.stringify(settings));applySettings();}
    onSnapshot(settingsRef,(snap)=>{if(snap.exists()){settings=snap.data();localStorage.setItem(SETKEY,JSON.stringify(settings));applySettings();}});

    const q=query(pedidosCol, orderBy("fechaCreacion","desc"));
    onSnapshot(q,(qs)=>{
      pedidosLocal=qs.docs.map(d=>({id:d.id,...d.data()}));
      // backup local para offline
      localStorage.setItem(CLAVE,JSON.stringify(pedidosLocal.map(p=>({...p,id:p.id||p.fechaCreacion}))));
      renderLista();
      $("syncStatus").textContent="● Firebase ✓ "+pedidosLocal.length+" pedidos";
    }, (err)=>{$("syncStatus").textContent="● offline";});
  }catch(e){$("syncStatus").textContent="● offline - local";}
}
init();
</script></body></html>
